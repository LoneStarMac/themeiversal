# Firefox theme graphics
firefox:
  header_width: 2560
  header_height: 200
  icon_size: 128
  # Subtle accent orbs drawn on the header gradient
  orbs:
    - color: accent
      radius: 340
      x: 0.82
      y: 1.35
      alpha: 0.10
    - color: accent_2
      radius: 260
      x: 0.06
      y: 1.30
      alpha: 0.08
    - color: accent_3
      radius: 180
      x: 0.55
      y: 1.55
      alpha: 0.07